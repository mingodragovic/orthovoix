<svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circle background -->
  <circle cx="50" cy="50" r="45" fill="white" />
  
  <!-- Inner shadow ring -->
  <circle 
    cx="50" 
    cy="50" 
    r="45" 
    fill="none" 
    stroke="rgba(74,144,217,0.15)" 
    stroke-width="4"
  />
  
  <!-- "O" letter -->
  <text 
    x="50" 
    y="68" 
    font-family="'Poppins', sans-serif" 
    font-size="55" 
    font-weight="bold" 
    fill="#4A90D9" 
    text-anchor="middle"
  >
    O
  </text>
  
  <!-- Speech bubble badge (bottom right) -->
  <g transform="translate(85, 85)">
    <!-- Badge background -->
    <circle cx="0" cy="0" r="12.25" fill="#F5A623" />
    
    <!-- Speech emoji -->
    <text 
      x="0" 
      y="3.675" 
      font-size="8.575" 
      text-anchor="middle" 
      dominant-baseline="central"
    >
      💬
    </text>
  </g>
</svg>