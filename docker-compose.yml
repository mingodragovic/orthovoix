services:
  postgres:
    image: postgres:16-alpine
    container_name: orthovoix_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: orthovoix_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orthovoix_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: orthovoix_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - orthovoix_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mc:
    image: minio/mc:latest
    container_name: orthovoix_mc
    depends_on:
      - minio
    networks:
      - orthovoix_network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myminio http://minio:9000 minioadmin ${MINIO_PASSWORD};
      mc mb myminio/orthovoix || true;
      mc anonymous set public myminio/orthovoix;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orthovoix_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: orthovoix_db
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: https://${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
      CORS_ORIGIN: https://${DOMAIN}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: orthovoix
      MINIO_PUBLIC_URL: https://${DOMAIN}/storage/
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    networks:
      - orthovoix_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orthovoix_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - orthovoix_network

  nginx:
    image: nginx:alpine
    container_name: orthovoix_nginx
    restart: always
    depends_on:
      - frontend
      - backend
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - orthovoix_network

networks:
  orthovoix_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: